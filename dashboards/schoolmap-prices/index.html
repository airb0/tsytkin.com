<title>Schools and flat prices — Paris</title>
<meta name="description" content="Public bilingual schools, international sections and private schools under state contract that teach CP in French and English, in Paris and Île-de-France, with catchment areas and school indicators.">

<style>
:root{--ink:#17212b;--muted:#64748b;--line:#dbe2ea;--bg:#f5f7fa;--public:#1769aa;--intl:#7b4ab5;--private:#b76a19}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{padding:18px 22px;background:#fff;border-bottom:1px solid var(--line)}h1{font-size:22px;line-height:1.2;margin:0 0 6px}header p{margin:0;color:var(--muted)}
body{display:flex;flex-direction:column;min-height:100vh}
@media(min-width:801px){body{height:100vh}}
main{display:grid;grid-template-columns:400px 1fr;flex:1;min-height:560px}
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.lang{display:flex;flex:none;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12px;font-weight:600}
.lang a{padding:5px 9px;color:var(--muted);text-decoration:none;border-left:1px solid var(--line)}.lang a:first-child{border-left:0}
.lang a:hover{color:var(--ink)}.lang a[aria-current]{background:var(--ink);color:#fff}
aside{overflow:auto;padding:14px;background:#fff;border-right:1px solid var(--line)}
#map{height:100%;min-height:560px}
.search{display:flex;gap:7px;margin-bottom:10px}.search input{min-width:0;flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}.search button{border:0;background:#17212b;color:#fff;border-radius:8px;padding:9px 12px;font:inherit;cursor:pointer}
.filters{margin:10px 0 12px;display:grid;gap:8px}
.fgroup{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.fgroup summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:9px 10px;font-weight:650;font-size:13px;background:#f7f9fb}
.fgroup summary::-webkit-details-marker{display:none}
.fgroup summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin:-3px 4px 0 0;transition:transform .15s}
.fgroup[open] summary::after{transform:rotate(-135deg);margin-top:3px}
.fgroup[open] summary{border-bottom:1px solid var(--line)}
.fgroup summary .sw{margin-left:auto;margin-right:12px;display:flex;align-items:center;gap:6px;font-weight:500;font-size:12px;color:var(--muted)}
.sw input{appearance:none;width:30px;height:18px;border-radius:9px;background:#cbd5e1;position:relative;cursor:pointer;margin:0;transition:background .15s}
.sw input::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked{background:#17212b}.sw input:checked::after{left:14px}
.scale.bins{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px;margin-bottom:6px}
.frow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line);font-size:13px}
.frow:first-child{border-top:0}
.frow label{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer}
.frow .count{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.dot.none{background:none;border:1.5px dashed #4c9bd1;border-radius:2px}
.info{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid #b9c4d0;background:#fff;color:var(--muted);font:600 11px/18px Georgia,serif;font-style:italic;text-align:center;cursor:pointer;padding:0}
.info:hover,.info[aria-expanded="true"]{border-color:var(--ink);color:var(--ink)}
.explain{display:none;font-size:12px;color:#334155;background:#f7f9fb;padding:8px 10px 9px;border-top:1px dashed var(--line);line-height:1.5}
.explain.open{display:block}
.slider{padding:10px 10px 12px;border-top:1px solid var(--line)}
.slider .head{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px}
.slider .head span{flex:1}
.slider input[type=range]{width:100%;accent-color:#17212b}
.slider .scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.fit{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}.fit input{display:block;width:100%;margin-top:3px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:14px;color:var(--ink)}
.fit input[type=range]{padding:0;border:0;margin-top:8px;accent-color:#17212b}
.walk{margin-bottom:8px}.walk .head{margin-bottom:2px;font-size:12px;color:var(--muted)}.walk input{width:100%;accent-color:#17212b}
#fitStatus{font-size:12px;font-weight:600;margin:0 0 8px}#fitStatus:empty{display:none}
.scale.three{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.ramp{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:2px 0 3px}.ramp i{flex:1}
.notice{background:#fff8e7;border:1px solid #f0dca9;border-radius:8px;padding:9px 10px;margin:10px 0;color:#684d13;font-size:12px}
.notice.error{background:#fdecec;border-color:#f1c0c0;color:#7a1f1f}
.status{font-size:12px;color:var(--muted);padding:7px 0}
#detail{border:1px solid var(--line);border-radius:9px;padding:12px;margin:10px 0;background:#fff}
#detail.empty{color:var(--muted);font-size:12px;border-style:dashed}
#detail h3{font-size:15px;margin:0 0 3px;padding-right:26px}#detail .meta{font-size:12px;color:var(--muted);margin-bottom:6px}
#detail p{font-size:12px;margin:4px 0 7px}#detail a{font-size:12px;color:#145e9a;text-decoration:none}#detail a:hover{text-decoration:underline}
#detail .close{float:right;border:0;background:none;font-size:18px;line-height:1;color:var(--muted);cursor:pointer;padding:0 2px}
.stats{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;background:#f7f9fb;border-radius:7px;padding:8px 9px;margin:8px 0}
.stats dt{color:var(--muted);display:flex;align-items:flex-start;gap:5px}.stats dd{margin:0;font-variant-numeric:tabular-nums}
.stats .info{width:16px;height:16px;font-size:10px;line-height:14px}
.stats .explain{grid-column:1/-1;border:0;border-radius:6px;background:#fff;margin:2px 0}
.ips-bar{display:inline-block;vertical-align:middle;width:70px;height:6px;border-radius:3px;background:#e5eaf0;margin-left:6px;position:relative;overflow:hidden}
.ips-bar i{position:absolute;left:0;top:0;bottom:0;background:#17212b;border-radius:3px}
.tag{font-size:10px;font-weight:700;border-radius:20px;padding:2px 6px;background:#edf2f7;color:#405366;margin-left:5px;white-space:nowrap}
.tag.paris{background:#e6f2fb;color:#125b91}.tag.intl{background:#f1eafb;color:#67379b}.tag.private{background:#fff0df;color:#91510e}.tag.rep{background:#fdecec;color:#8a2323}
.small{font-size:11px;color:var(--muted)}
#result{display:none;padding:9px 10px;border:1px solid #b7d7ed;background:#eff8ff;border-radius:8px;margin:8px 0;font-size:12px}
@media(max-width:800px){.fit input{font-size:16px}}
/* Phone: aside dissolves so the search and filters sit above the map, details and notes below it. */
@media(max-width:800px){main{display:flex;flex-direction:column;height:auto;background:#fff}aside{display:contents}
 aside>*{margin-left:14px!important;margin-right:14px!important}
 .search{order:1;margin-top:12px}#result{order:2}#filters{order:3}#map{order:4;height:60vh;min-height:350px}#mapError{order:5}#detail{order:6}#sectorStatus{order:7}.method{order:8}
 header{padding:14px}}
.bar{background:#fff;border-bottom:1px solid var(--line)}.bar .in{display:flex;align-items:center;height:48px;padding:0 22px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden}.bar a{color:var(--muted);font-weight:500;text-decoration:none}.bar a:hover{color:var(--ink)}.bar .sep{color:#a3a3a3;font-weight:400;margin:0 6px}
@media(max-width:800px){.bar .in{padding:0 14px}}
</style>
</head>

const I18N=/*I18N*/{"ui":{"en":{"pageTitle":"French–English schools with CP — Paris and Île-de-France","title":"French–English schools with CP","subtitle":"Paris and nearby suburbs · public bilingual schools, international sections and private schools under state contract · school year 2026–2027","addrPlaceholder":"Apartment address to check the catchment area…","addrAria":"Apartment address","check":"Check","clickPin":"Click a pin on the map to see the school here.","loadingSectors":"Loading official Paris catchment boundaries…","methodHtml":"<b>Method.<\/b> Included: schools where both CP and an English programme are confirmed (a bilingual programme or a British/American international section). Ordinary English lessons (LV1) do not count as a bilingual programme. The suburbs (92, 93, 94 and the part of 78 near Paris) were searched in November 2026 for public bilingual programmes and private bilingual schools under contract: none was found in 92, 93 or 94 beyond the international sections; private schools without a state contract (hors contrat) are not included. Check places, campus and admission rules for 2026–2027 before applying.<br><br><b>Indicators.<\/b> IPS and REP: data.education.gouv.fr (IPS des écoles, 2024–2025). Pupils and classes: Effectifs d’élèves par école, 2025.<br><br><b>Locations.<\/b> School coordinates and addresses come from the official Annuaire de l’éducation (data.education.gouv.fr, November 2026). Apartment addresses are looked up with the Base Adresse Nationale (api-adresse.data.gouv.fr). Catchment areas: DASCO / Ville de Paris. Flat prices: DVF 2025 (geo-dvf, Etalab), median price per m² of single-flat sales in hexagons of about 600 m, at least 6 sales each.","cat_paris":"Public Paris","cat_paris_explain":"Free state schools run by the City of Paris with a French–English bilingual programme: the French national curriculum, with part of the lessons taught in English. Admission is strictly by home address (the school’s catchment area); there is no test and no fee. Compared with an international section, the English is lighter but open to every child in the area. Click a blue pin to see its catchment area.","cat_intl":"Public international","cat_intl_explain":"Free state schools with a British or American international section: several extra hours a week of English language and literature (often history too), taught by native teachers on top of the French curriculum. Admission by application and an English test, from any address; aimed at children who are already bilingual. The parents’ association running the section usually charges an annual fee. More demanding than Public Paris; no catchment area.","cat_private":"Private (sous contrat)","cat_private_explain":"Private schools under contract with the state: they follow the national curriculum and the state pays the teachers, so fees are moderate compared with fully private international schools. Each school runs its own admission; there is no catchment area. How much is taught in English varies a lot from school to school, so check the CP hours. Schools without a state contract (hors contrat) are not shown.","ipsExplain":"IPS (indice de position sociale) is the ministry’s index of the social background of a school’s pupils, computed from their parents’ occupations. National average about 106 (2024–2025); most schools fall between 80 and 150. Higher means more advantaged families. It describes who attends the school, not how well it teaches, although it correlates with test results. Schools without a published IPS stay visible whatever the filter.","priceExplain":"Median price per m² of flats sold in 2025, from the official register of property sales (DVF). Each hexagon is about 600 m across and is shown only if at least 6 flats were sold in it. Only sales of a single flat are counted (a parking space or cellar may be included in the price). Click a hexagon to see the median, the middle half of prices and the number of sales. These are real sale prices, not asking prices, but they reflect the 2025 market rather than today’s.","sectorExplain":"Each Paris public school takes children from a fixed list of streets (its secteur scolaire). Tick this to see the catchment areas of all bilingual Paris schools at once; otherwise a blue pin shows only its own area.","whatMeans":"What does this mean?","allSectors":"All Paris catchment areas","ipsFrom":"Social index (IPS) from","any":"any","minIpsAria":"Minimum social index","franceAvg":"France avg ≈ 106","priceRow":"Median sale price of flats, €/m², 2025","grpSchools":"Schools","grpPrices":"Flat prices","priceSwitchTitle":"Show or hide flat prices on the map","on":"On","off":"Off","countOf":"{v} of {n}","ipsLabel":"Social index (IPS)","ipsScale":"scale 60–160","ipsCompare":"dept {d} · France {f} · {y}","notPublished":"not published","pupils":"Pupils","pupilsVal":"{n} in {c} classes · {p} per class","cpPupils":"CP pupils","priority":"Priority education","zoneParis":"Its catchment area is highlighted on the map.","zoneIntl":"No catchment area: admission by application and language assessment.","zonePrivate":"Private school: no catchment area.","tagParis":"PUBLIC PARIS","tagIntl":"SECTION","tagPrivate":"PRIVATE","source":"Source / details","close":"Close","sectorTitle":"Elementary catchment area · 2026–2027","sectorSchools":"Schools for this area: {s}","keyRejected":"<b>Google Maps rejected the key.<\/b> Most likely the Maps JavaScript API is not enabled in the key’s project, or the key is restricted to another website. The address check works without the map.","mapLoadFail":"<b>Could not load Google Maps.<\/b> No network, or the script is blocked.","priceHere":"Flat prices here · 2025","median":"Median","middleHalf":"Middle half","sales":"Sales","salesVal":"{n} flats","priceNote":"Area of about 600 m across. Source: DVF 2025 (Etalab), sales of a single flat.","sectorsLoaded":"Catchment areas loaded: {n}. Source: DASCO / Ville de Paris, ID_PROJET 4913 (2026–2027).","sectorsFail":"Could not load the Paris Data catchment layer.","openLayer":"Open the official layer","reason":"Reason:","addrUnavailable":"address service unavailable","addrNotFound":"address not found","addrChecked":"Address checked:","lookingUp":"Looking up the address…","addrFoundNoLayer":"Address found ({a}), but the catchment layer has not loaded yet.","notInSector":"This address is not in the catchment area of any of the bilingual schools shown.<br>Your child can still attend another public school; only the catchment areas of the English-bilingual schools are shown here.","inSector":"This address is inside the catchment area of:","finalConfirm":"Final confirmation comes from the mairie / service des affaires scolaires for your address and entry year.","lookupFail":"Could not look up the address:","language":"Language","fitTitle":"Find a flat","areaLabel":"Area from, m²","budgetLabel":"Budget up to, €","fitExplain":"Enter a minimum area and a maximum budget to keep only the areas where such flats really sold in 2025. An area stays highlighted if at least 3 flats of that size or larger sold within the budget and they make up at least 10% of the flats of that size sold there, so one bargain or unusual sale does not count. The darker the green, the larger the share. These are 2025 sale prices; a parking space or cellar may be included, and notary fees come on top. Walking time is an estimate from the straight-line distance to the nearest metro or RER station (stations: IDFM; about 80 m a minute with an allowance for streets), not a real route.","fitLegend":"Share of flats that fit the budget","fitCount":"Areas that fit: {n}","fitRow":"Flats that fit","fitVal":"{k} of {n} sold ({p}%)","fitMedian":"Typical match","fitMedianVal":"{s} m² for {p} €","walkLabel":"Walk to metro or RER:","walkMin":"{n} min","fitWalkRow":"Walk to metro or RER","walkAny":"any","walkUpTo":"up to {n} min"},"fr":{"pageTitle":"Écoles franco-anglaises avec CP — Paris et Île-de-France","title":"Écoles franco-anglaises avec CP","subtitle":"Paris et proche banlieue · écoles publiques bilingues, sections internationales et écoles privées sous contrat · année scolaire 2026–2027","addrPlaceholder":"Adresse du logement pour vérifier le secteur scolaire…","addrAria":"Adresse du logement","check":"Vérifier","clickPin":"Cliquez sur une épingle de la carte pour afficher l’école ici.","loadingSectors":"Chargement des secteurs scolaires officiels de Paris…","methodHtml":"<b>Méthode.<\/b> Sont incluses les écoles où le CP et un parcours en anglais sont tous deux confirmés (un programme bilingue ou une section internationale britannique/américaine). Les cours d’anglais ordinaires (LV1) ne comptent pas comme un programme bilingue. La banlieue (92, 93, 94 et la partie des Yvelines proche de Paris) a été passée en revue en novembre 2026 à la recherche de programmes bilingues publics et d’écoles bilingues privées sous contrat : aucune n’a été trouvée dans le 92, le 93 ou le 94 en dehors des sections internationales ; les écoles privées hors contrat ne sont pas incluses. Vérifiez les places, le site et les règles d’admission pour 2026–2027 avant de candidater.<br><br><b>Indicateurs.<\/b> IPS et REP : data.education.gouv.fr (IPS des écoles, 2024–2025). Élèves et classes : Effectifs d’élèves par école, 2025.<br><br><b>Localisation.<\/b> Les coordonnées et adresses des écoles proviennent de l’Annuaire de l’éducation officiel (data.education.gouv.fr, novembre 2026). Les adresses des logements sont recherchées avec la Base Adresse Nationale (api-adresse.data.gouv.fr). Secteurs scolaires : DASCO / Ville de Paris. Prix des logements : DVF 2025 (geo-dvf, Etalab), prix médian au m² des ventes d’un seul appartement dans des hexagones d’environ 600 m, avec au moins 6 ventes chacun.","cat_paris":"Public Paris","cat_paris_explain":"Écoles publiques gratuites gérées par la Ville de Paris avec un programme bilingue franco-anglais : le programme national français, dont une partie des cours est dispensée en anglais. L’admission se fait strictement selon l’adresse du domicile (le secteur scolaire de l’école) ; il n’y a ni test ni frais. Par rapport à une section internationale, l’anglais est moins présent mais ouvert à tous les enfants du secteur. Cliquez sur une épingle bleue pour voir son secteur scolaire.","cat_intl":"Public international","cat_intl_explain":"Écoles publiques gratuites avec une section internationale britannique ou américaine : plusieurs heures par semaine de langue et de littérature anglaises (souvent aussi d’histoire), assurées par des enseignants natifs en plus du programme français. Admission sur dossier et test d’anglais, quelle que soit l’adresse ; destinée aux enfants déjà bilingues. L’association de parents qui gère la section demande généralement une cotisation annuelle. Plus exigeant que Public Paris ; pas de secteur scolaire.","cat_private":"Privé (sous contrat)","cat_private_explain":"Établissements privés sous contrat avec l’État : ils suivent le programme national et l’État rémunère les enseignants, ce qui rend les frais modérés par rapport aux écoles internationales entièrement privées. Chaque école gère son admission ; il n’y a pas de secteur scolaire. La part de l’enseignement en anglais varie beaucoup d’une école à l’autre : vérifiez les horaires en CP. Les écoles hors contrat ne sont pas affichées.","ipsExplain":"L’IPS (indice de position sociale) est l’indicateur du ministère sur l’origine sociale des élèves d’une école, calculé à partir des professions de leurs parents. Moyenne nationale d’environ 106 (2024–2025) ; la plupart des écoles se situent entre 80 et 150. Plus il est élevé, plus les familles sont favorisées. Il décrit qui fréquente l’école, pas la qualité de son enseignement, même s’il est corrélé aux résultats aux évaluations. Les écoles sans IPS publié restent visibles quel que soit le filtre.","priceExplain":"Prix médian au m² des appartements vendus en 2025, d’après le registre officiel des ventes immobilières (DVF). Chaque hexagone mesure environ 600 m de large et n’est affiché que si au moins 6 appartements y ont été vendus. Seules les ventes d’un seul appartement sont comptées (un parking ou une cave peuvent être inclus dans le prix). Cliquez sur un hexagone pour voir la médiane, la moitié centrale des prix et le nombre de ventes. Ce sont des prix de vente réels, pas des prix demandés, mais ils reflètent le marché de 2025 et non celui d’aujourd’hui.","sectorExplain":"Chaque école publique parisienne accueille les enfants d’une liste fixe de rues (son secteur scolaire). Cochez pour voir d’un coup les secteurs scolaires de toutes les écoles bilingues de Paris ; sinon, une épingle bleue n’affiche que son propre secteur.","whatMeans":"Qu’est-ce que cela signifie ?","allSectors":"Tous les secteurs scolaires de Paris","ipsFrom":"Indice de position sociale (IPS) à partir de","any":"tous","minIpsAria":"Indice de position sociale minimum","franceAvg":"Moyenne France ≈ 106","priceRow":"Prix médian de vente des appartements, €/m², 2025","grpSchools":"Écoles","grpPrices":"Prix des logements","priceSwitchTitle":"Afficher ou masquer les prix des logements sur la carte","on":"Oui","off":"Non","countOf":"{v} sur {n}","ipsLabel":"Indice de position sociale (IPS)","ipsScale":"échelle 60–160","ipsCompare":"dép. {d} · France {f} · {y}","notPublished":"non publié","pupils":"Élèves","pupilsVal":"{n} dans {c} classes · {p} par classe","cpPupils":"Élèves de CP","priority":"Éducation prioritaire","zoneParis":"Son secteur scolaire est mis en évidence sur la carte.","zoneIntl":"Pas de secteur scolaire : admission sur dossier et évaluation linguistique.","zonePrivate":"École privée : pas de secteur scolaire.","tagParis":"PUBLIC PARIS","tagIntl":"SECTION","tagPrivate":"PRIVÉ","source":"Source / détails","close":"Fermer","sectorTitle":"Secteur scolaire élémentaire · 2026–2027","sectorSchools":"Écoles de ce secteur : {s}","keyRejected":"<b>Google Maps a refusé la clé.<\/b> Probablement, l’API Maps JavaScript n’est pas activée dans le projet de la clé, ou la clé est restreinte à un autre site. La vérification d’adresse fonctionne sans la carte.","mapLoadFail":"<b>Impossible de charger Google Maps.<\/b> Pas de réseau, ou le script est bloqué.","priceHere":"Prix des logements ici · 2025","median":"Médiane","middleHalf":"Moitié centrale","sales":"Ventes","salesVal":"{n} appartements","priceNote":"Zone d’environ 600 m de large. Source : DVF 2025 (Etalab), ventes d’un seul appartement.","sectorsLoaded":"Secteurs scolaires chargés : {n}. Source : DASCO / Ville de Paris, ID_PROJET 4913 (2026–2027).","sectorsFail":"Impossible de charger la couche des secteurs scolaires de Paris Data.","openLayer":"Ouvrir la couche officielle","reason":"Raison :","addrUnavailable":"service d’adresses indisponible","addrNotFound":"adresse introuvable","addrChecked":"Adresse vérifiée :","lookingUp":"Recherche de l’adresse…","addrFoundNoLayer":"Adresse trouvée ({a}), mais la couche des secteurs scolaires n’est pas encore chargée.","notInSector":"Cette adresse ne se trouve dans le secteur scolaire d’aucune des écoles bilingues affichées.<br>Votre enfant peut tout de même fréquenter une autre école publique ; seuls les secteurs des écoles bilingues franco-anglaises sont affichés ici.","inSector":"Cette adresse se trouve dans le secteur scolaire de :","finalConfirm":"La confirmation définitive relève de la mairie / du service des affaires scolaires, pour votre adresse et votre année d’entrée.","lookupFail":"Impossible de rechercher l’adresse :","language":"Langue","fitTitle":"Trouver un logement","areaLabel":"Surface min., m²","budgetLabel":"Budget max., €","fitExplain":"Indiquez une surface minimale et un budget maximal pour ne garder que les zones où de tels logements se sont réellement vendus en 2025. Une zone reste en surbrillance si au moins 3 logements de cette surface ou plus se sont vendus dans le budget et représentent au moins 10 % des logements de cette surface vendus sur place : une affaire isolée ou une vente atypique ne compte donc pas. Plus le vert est foncé, plus la part est élevée. Ce sont des prix de vente 2025 ; un parking ou une cave peuvent être inclus, les frais de notaire s’ajoutent. Le temps de marche est une estimation à partir de la distance à vol d’oiseau jusqu’à la station de métro ou de RER la plus proche (stations : IDFM ; environ 80 m par minute, avec une marge pour les rues), pas un itinéraire réel.","fitLegend":"Part des logements dans le budget","fitCount":"Zones qui correspondent : {n}","fitRow":"Logements qui correspondent","fitVal":"{k} sur {n} vendus ({p} %)","fitMedian":"Cas typique","fitMedianVal":"{s} m² pour {p} €","walkLabel":"À pied du métro ou du RER :","walkMin":"{n} min","fitWalkRow":"À pied du métro ou du RER","walkAny":"indifférent","walkUpTo":"jusqu’à {n} min"},"ru":{"pageTitle":"Франко-английские школы с CP — Париж и Иль-де-Франс","title":"Франко-английские школы с CP","subtitle":"Париж и ближний пригород · государственные двуязычные школы, международные секции и частные школы sous contrat · 2026–2027 учебный год","addrPlaceholder":"Адрес квартиры, чтобы проверить школьный сектор…","addrAria":"Адрес квартиры","check":"Проверить","clickPin":"Нажмите на метку на карте, чтобы увидеть школу здесь.","loadingSectors":"Загружаем официальные границы школьных секторов Парижа…","methodHtml":"<b>Метод.<\/b> В список вошли школы, где подтверждены и CP, и программа на английском (двуязычная программа или британская/американская section internationale). Обычные уроки английского (LV1) двуязычной программой не считаются. В пригороде (92, 93, 94 и ближняя к Парижу часть 78) в ноябре 2026 искали государственные двуязычные программы и частные двуязычные школы sous contrat (с договором с государством): в 92, 93 и 94 кроме международных секций ничего не нашлось; частные школы без договора (hors contrat) не включены. Перед подачей заявления проверьте места, кампус и правила приёма на 2026–2027.<br><br><b>Показатели.<\/b> IPS и REP: data.education.gouv.fr (IPS des écoles, 2024–2025). Ученики и классы: Effectifs d’élèves par école, 2025.<br><br><b>Расположение.<\/b> Координаты и адреса школ взяты из официального Annuaire de l’éducation (data.education.gouv.fr, ноябрь 2026). Адреса квартир ищутся через Base Adresse Nationale (api-adresse.data.gouv.fr). Границы школьных секторов: DASCO / Ville de Paris. Цены на квартиры: DVF 2025 (geo-dvf, Etalab), медианная цена за м² по продажам одной квартиры в шестиугольниках около 600 м, не менее 6 сделок в каждом.","cat_paris":"Государственные, Париж","cat_paris_explain":"Бесплатные государственные школы Ville de Paris с франко-английской двуязычной программой: французская национальная программа, часть уроков идёт на английском. Приём строго по адресу проживания (школьный сектор, secteur scolaire), без тестов и платы. По сравнению с section internationale английского меньше, зато школа открыта любому ребёнку из района. Нажмите на синюю метку, чтобы увидеть её сектор.","cat_intl":"Государственные, международные","cat_intl_explain":"Бесплатные государственные школы с британской или американской section internationale: несколько дополнительных часов в неделю английского языка и литературы (часто ещё и истории) с носителями языка сверх французской программы. Приём по заявке и тесту по английскому, с любого адреса; рассчитано на детей, которые уже двуязычны. Родительская ассоциация, которая ведёт секцию, обычно берёт ежегодный взнос. Требования выше, чем в «Государственных, Париж»; сектора нет.","cat_private":"Частные (sous contrat)","cat_private_explain":"Частные школы с договором с государством: они учат по национальной программе, зарплату учителям платит государство, поэтому плата умеренная по сравнению с полностью частными международными школами. Каждая школа сама решает, кого принимать; сектора нет. Сколько преподавания идёт на английском, сильно зависит от школы, так что уточните часы в CP. Школы без договора (hors contrat) не показаны.","ipsExplain":"IPS (indice de position sociale) — индекс министерства, который показывает социальное происхождение учеников школы; считается по профессиям родителей. Средний по стране около 106 (2024–2025); у большинства школ от 80 до 150. Чем выше, тем благополучнее семьи. Он говорит о том, кто учится в школе, а не о качестве преподавания, хотя с результатами тестов связан. Школы без опубликованного IPS остаются на карте при любом фильтре.","priceExplain":"Медианная цена за м² квартир, проданных в 2025 году, по официальному реестру сделок с недвижимостью (DVF). Каждый шестиугольник около 600 м в поперечнике и показывается, только если в нём продано не менее 6 квартир. Считаются только продажи одной квартиры (в цену может входить парковка или подвал). Нажмите на шестиугольник, чтобы увидеть медиану, средние 50 % цен и число сделок. Это реальные цены сделок, а не цены из объявлений, но они отражают рынок 2025 года, а не сегодняшний.","sectorExplain":"Каждая государственная школа Парижа берёт детей с фиксированного списка улиц (школьный сектор, secteur scolaire). Отметьте, чтобы увидеть сразу все секторы двуязычных школ Парижа; иначе синяя метка показывает только свой.","whatMeans":"Что это значит?","allSectors":"Все школьные секторы Парижа","ipsFrom":"Социальный индекс (IPS) от","any":"любой","minIpsAria":"Минимальный социальный индекс","franceAvg":"Франция в среднем ≈ 106","priceRow":"Медианная цена продажи квартир, €/м², 2025","grpSchools":"Школы","grpPrices":"Цены на квартиры","priceSwitchTitle":"Показать или скрыть цены на квартиры на карте","on":"Вкл.","off":"Выкл.","countOf":"{v} из {n}","ipsLabel":"Социальный индекс (IPS)","ipsScale":"шкала 60–160","ipsCompare":"деп. {d} · Франция {f} · {y}","notPublished":"не опубликован","pupils":"Ученики","pupilsVal":"{n} в {c} классах · {p} в классе","cpPupils":"Ученики CP","priority":"Приоритетное образование","zoneParis":"Её сектор выделен на карте.","zoneIntl":"Сектора нет: приём по заявке и языковому тесту.","zonePrivate":"Частная /* The filters come back on the next visit, in this browser only. Saved values are checked, so a stale or damaged entry falls back to the defaults. */
const FILTERS_KEY='schoolmap-filters',FILTER_GROUPS=['grp-schools','grp-prices'];
function saveFilters(){
 const on=id=>document.getElementById(id)?.checked;
 const groups={};for(const id of FILTER_GROUPS){const g=document.getElementById(id);if(g)groups[id]=g.open;}
 try{localStorage.setItem(FILTERS_KEY,JSON.stringify({show,sectors:on('showSectors'),ips:minIps,prices:on('showPrices'),area:minArea,budget:maxBudget,walk:maxWalk,groups}));}catch(e){}
}
function restoreFilters(){
 let s=null;try{s=JSON.parse(localStorage.getItem(FILTERS_KEY));}catch(e){}
 if(!s||typeof s!=='object')return;
 const inRange=(v,lo,hi,d)=>Number.isFinite(v)&&v>=lo&&v<=hi?v:d;
 for(const c of CATS)if(typeof s.show?.[c]==='boolean'){show[c]=s.show[c];document.querySelector(`input[data-cat="${c}"]`).checked=show[c];}
 if(typeof s.sectors==='boolean')document.getElementById('showSectors').checked=s.sectors;
 minIps=inRange(s.ips,80,160,80);document.getElementById('ipsMin').value=minIps;
 for(const id of FILTER_GROUPS){const g=document.getElementById(id);if(g&&typeof s.groups?.[id]==='boolean')g.open=s.groups[id];}
 if(!PRICES)return;
 if(typeof s.prices==='boolean'){document.getElementById('showPrices').checked=s.prices;document.getElementById('priceState').textContent=s.prices?T('on'):T('off');}
 minArea=inRange(s.area,0,9999,0);maxBudget=inRange(s.budget,0,1e8,0);maxWalk=inRange(s.walk,0,30,0);
 const set=(id,v)=>{document.getElementById(id).value=v;},max=id=>document.getElementById(id).max;
 set('areaMin',minArea||'');set('areaRange',minArea);
 set('budgetMax',maxBudget?fmt(maxBudget):'');set('budgetRange',maxBudget||max('budgetRange'));
 set('walkRange',maxWalk||max('walkRange'));
}

function buildFilters(){
 const root=document.getElementById('filters');
 const row=(inner,expId,text)=>`<div class="frow">${inner}${infoBtn(expId)}</div><div class="explain" id="${expId}">${text}</div>`;

  h+=row(`<label><input type="checkbox" data-cat="${c}" checked><i class="dot" style="background:${colors[c]}"></i>${T('cat_'+c)}</label><span class="count" id="count-${c}"></span>`,'exp-'+c,T('cat_'+c+'_explain'));

 let html=grp('grp-schools',T('grpSchools'),h);
 if(PRICES){

  html+=grp('grp-prices',T('grpPrices'),p,`<label class="sw" title="${esc(T('priceSwitchTitle'))}"><span id="priceState">${T('on')}</span><input type="checkbox" id="showPrices" checked aria-label="${esc(T('priceSwitchTitle'))}"></label>`);

 if(PRICES){
  const sp=document.getElementById('showPrices');

 }
 const r=document.getElementById('ipsMin');
 r.addEventListener('input',()=>{minIps=+r.value;applyFilters();});
 applyFilters();
}
function applyFilters(){
 document.getElementById('ipsVal').textContent=minIps<=80?T('any'):minIps;
 for(const c of CATS){
  const all=schools.filter(s=>s.cat===c),vis=all.filter(visible);
  document.getElementById('count-'+c).textContent=vis.length===all.length?all.length:T('countOf',{v:vis.length,n:all.length});
 }
 for(const s of schools){const m=schoolMarkers[s.id];if(m)m.map=visible(s)?map:null;}
}

function statsHtml(s){
 const x=indicators[s.uai];if(!x)return '';
 const lab=`${T('ipsLabel')}${infoBtn('exp-ips-detail')}`;
 let h;
 if(x.ips!=null){
  const w=Math.max(0,Math.min(100,(x.ips-60)/(160-60)*100));
  h=`<dt>${lab}</dt><dd><b>${fmt(x.ips,1)}</b><span class="ips-bar" title="${esc(T('ipsScale'))}"><i style="width:${w}%"></i></span><br><span class="small">${T('ipsCompare',{d:fmt(x.ips_dep,1),f:fmt(x.ips_nat,1),y:esc(x.ips_year)})}</span></dd>`;
 }else h=`<dt>${lab}</dt><dd><span class="small">${T('notPublished')}</span></dd>`;
 h+=`<div class="explain" id="exp-ips-detail">${T('ipsExplain')}</div>`;
 if(x.eleves!=null){
  h+=`<dt>${T('pupils')}</dt><dd>${T('pupilsVal',{n:fmt(x.eleves),c:fmt(x.classes),p:fmt(x.classes?x.eleves/x.classes:null,1)})}</dd>`;
  h+=`<dt>${T('cpPupils')}</dt><dd>${fmt(x.cp)} <span class="small">(${esc(x.eff_year)})</span></dd>`;
 }
 if(x.rep||x.rep_plus)h+=`<dt>${T('priority')}</dt><dd>${x.rep_plus?'REP+':'REP'}</dd>`;
 return '<dl class="stats">'+h+'</dl>';
}
function zoneLine(s){return `<p class="small">${T({paris:'zoneParis',intl:'zoneIntl',private:'zonePrivate'}[s.cat])}</p>`;}
function closeBtn(){return `<button class="close" aria-label="${esc(T('close'))}">×</button>`;}
function renderDetail(s){
 const box=document.getElementById('detail');box.classList.remove('empty');
 const x=indicators[s.uai]||{};
 const rep=x.rep_plus?'<span class="tag rep">REP+</span>':x.rep?'<span class="tag rep">REP</span>':'';
 const label=T({paris:'tagParis',intl:'tagIntl',private:'tagPrivate'}[s.cat]);
 box.innerHTML=`${closeBtn()}<h3>${esc(s.name)} <span class="tag ${s.cat}">${label}</span>${rep}</h3><div class="meta">${esc(ST(s,'city'))} · ${esc(s.address)}</div><p><b>${esc(ST(s,'kind'))}</b></p>${statsHtml(s)}<p>${esc(ST(s,'note'))}</p>${zoneLine(s)}<a target="_blank" rel="noopener" href="${s.src}">${T('source')}</a>`;
 box.querySelector('.close').addEventListener('click',clearSelection);
}
function renderSectorDetail(f){
 const box=document.getElementById('detail');box.classList.remove('empty');
 const g=k=>f.getProperty(k);
 const names=[g('lib_etab_1'),g('lib_etab_2'),g('lib_etab_3'),g('lib_etab_4')].filter(Boolean).join(', ');
 box.innerHTML=`${closeBtn()}<h3>${T('sectorTitle')}</h3><div class="meta">${esc(g('libelle')||'')}</div><p>${T('sectorSchools',{s:esc(names)})}</p>`;
 box.querySelector('.close').addEventListener('click',clearSelection);
}
function setPinSize(id,big){try{const p=schoolPins[id];if(p)p.scale=big?1.35:.9;const m=schoolMarkers[id];if(m)m.zIndex=big?999:null;}catch(e){}}
function clearSelection(){
 if(selectedId)setPinSize(selectedId,false);
 selectedId=null;selectedSector=null;refreshSectors();
 const box=document.getElementById('detail');box.className='empty';box.textContent=T('clickPin');
}
function showGlobalError(html){const el=document.getElementById('mapError');el.innerHTML=html;el.style.display='block';}
window.gm_authFailure=()=>showGlobalError(T('keyRejected'));

/* DVF price hexagons: pointy-top axial grid in a local metric projection around Notre-Dame (same as data/scripts/price_hex.py). */
function buildPriceLayer(){
 if(!PRICES)return;
 const R=PRICES.meta.radius_m,[lon0,lat0]=PRICES.meta.origin,KX=111320*Math.cos(lat0*Math.PI/180),KY=110574;
 const feats=PRICES.hex.map(([q,r,m,n,q1,q3,s])=>{
  const cx=R*Math.sqrt(3)*(q+r/2),cy=R*1.5*r,ring=[];
  for(let i=0;i<=6;i++){const a=Math.PI/180*(60*i-30);ring.push([lon0+(cx+R*Math.cos(a))/KX,lat0+(cy+R*Math.sin(a))/KY]);}
  return {type:'Feature',geometry:{type:'Polygon',coordinates:[ring]},properties:{m,n,q1,q3,s}};
 });
 priceLayer=new google.maps.Data({map});
 priceLayer.addGeoJson({type:'FeatureCollection',features:feats});
 priceLayer.addListener('click',e=>renderPriceDetail(e.feature));
 refreshPrices();
}
/* Area, budget and station filter, on real 2025 sales: a hexagon stays if at least 3 flats of that size sold within the budget and they are at least 10% of the flats of that size, so one odd bargain does not light up an expensive area. */
function fitOf(f){
 const s=f.getProperty('s'),ok=[];let big=0;
 for(let i=0;i<s.length;i+=3){if(s[i]>=minArea&&(!maxWalk||s[i+2]<=maxWalk)){big++;if(!maxBudget||s[i+1]*1000<=maxBudget)ok.push([s[i],s[i+1],s[i+2]]);}}
 return {big,ok,share:big?ok.length/big:0,show:ok.length>=3&&(!maxBudget||ok.length/big>=.1)};
}
function fitActive(){return minArea>0||maxBudget>0||maxWalk>0;}
function fitColor(share){for(const [lim,c] of FIT_STOPS)if(share<lim)return c;}
function renderPriceLegend(){
 const box=document.getElementById('priceLegend');if(!box)return;
 box.innerHTML=maxBudget?`<div class="small">${T('fitLegend')}</div><div class="ramp">${FIT_STOPS.map(s=>`<i style="background:${s[1]}"></i>`).join('')}</div><div class="scale three"><span>10–25%</span><span>25–60%</span><span>60%+</span></div>`
  :`<div class="small">${T('priceRow')}</div><div class="ramp">${PRICE_STOPS.map(s=>`<i style="background:${s[1]}"></i>`).join('')}</div><div class="scale bins"><span>&lt;4k</span><span>4–6</span><span>6–8</span><span>8–10</span><span>10–12</span><span>12–14</span><span>14k+</span></div>`;
}
function refreshPrices(){
 renderPriceLegend();
 if(!priceLayer)return;
 const on=document.getElementById('showPrices').checked,active=fitActive();
 let n=0;
 priceLayer.forEach(f=>{const r=active?fitOf(f):null;fitCache.set(f,r);if(r&&r.show)n++;});
 document.getElementById('fitStatus').textContent=active?T('fitCount',{n:fmt(n)}):'';
 priceLayer.setStyle(f=>{
  const r=fitCache.get(f),m=f.getProperty('m');
  return {visible:on&&(!r||r.show),fillColor:r&&maxBudget?fitColor(r.share):priceColor(m),fillOpacity:r&&maxBudget?.6:.45,strokeWeight:0,zIndex:1,clickable:true};
 });
}
function medianOf(a){const v=[...a].sort((x,y)=>x-y),m=v.length>>1;return v.length%2?v[m]:(v[m-1]+v[m])/2;}
function fitRows(f){
 const r=fitCache.get(f);if(!r||!r.ok.length)return '';
 return `<dt>${T('fitRow')}</dt><dd><b>${T('fitVal',{k:fmt(r.ok.length),n:fmt(r.big),p:fmt(r.share*100)})}</b></dd><dt>${T('fitMedian')}</dt><dd>${T('fitMedianVal',{s:fmt(medianOf(r.ok.map(x=>x[0]))),p:fmt(medianOf(r.ok.map(x=>x[1]))*1000)})}</dd><dt>${T('fitWalkRow')}</dt><dd>≈ ${T('walkMin',{n:fmt(medianOf(r.ok.map(x=>x[2])))})}</dd>`;
}
function renderPriceDetail(f){
 const box=document.getElementById('detail');box.classList.remove('empty');
 const g=k=>f.getProperty(k);
 box.innerHTML=`${closeBtn()}<h3>${T('priceHere')}</h3><dl class="stats"><dt>${T('median')}</dt><dd><b>${fmt(g('m'))} €/m²</b></dd><dt>${T('middleHalf')}</dt><dd>${fmt(g('q1'))} – ${fmt(g('q3'))} €/m²</dd><dt>${T('sales')}</dt><dd>${T('salesVal',{n:fmt(g('n'))})}</dd>${fitRows(f)}</dl><p class="small">${T('priceNote')}</p>`;
 box.querySelector('.close').addEventListener('click',clearSelection);
}
function sectorMatches(f,key){return ['lib_etab_1','lib_etab_2','lib_etab_3','lib_etab_4'].some(k=>String(f.getProperty(k)||'').includes(key));}
function refreshSectors(){
 if(!map)return;
 const all=document.getElementById('showSectors').checked;
 map.data.setStyle(f=>{
  const sel=selectedSector&&sectorMatches(f,selectedSector);
  const hit=addressHits.has(f.getProperty('objectid'));
  return {visible:all||sel||hit,strokeColor:sel?'#0b3f66':'#125b91',strokeWeight:sel?1:.7,strokeOpacity:.6,fillColor:sel?'#2f86c6':'#4c9bd1',fillOpacity:sel?.4:.2,zIndex:2,clickable:true};
 });
}
function fitSector(key){
 const b=new google.maps.LatLngBounds();let any=false;
 map.data.forEach(f=>{if(sectorMatches(f,key)){f.getGeometry().forEachLatLng(ll=>{b.extend(ll);any=true;});}});
 return any?b:null;
}
function showSchool(id){
 const s=schools.find(x=>x.id===id);if(!s)return;
 if(selectedId)setPinSize(selectedId,false);
 selectedId=id;setPinSize(id,true);
 renderDetail(s);
 if(window.matchMedia('(max-width:800px)').matches)document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'nearest'});
 if(!map)return;
 selectedSector=s.sector||null;refreshSectors();
 const b=s.sector&&fitSector(s.sector);
 if(b){b.extend({lat:s.lat,lng:s.lng});map.fitBounds(b,40);}
 else if(map.getZoom()<13||!map.getBounds()?.contains({lat:s.lat,lng:s.lng})){map.setZoom(14);map.panTo({lat:s.lat,lng:s.lng});}
}

async function initMap(){
 const {Map}=await google.maps.importLibrary('maps');
 const {AdvancedMarkerElement,PinElement}=await google.maps.importLibrary('marker');
 map=new Map(document.getElementById('map'),{center:{lat:48.8566,lng:2.3522},zoom:11,mapId:'DEMO_MAP_ID',streetViewControl:true,mapTypeControl:true,fullscreenControl:true,clickableIcons:false});
 for(const s of schools){
  const pin=new PinElement({background:colors[s.cat],borderColor:'#ffffff',glyphColor:'#ffffff',scale:.9});
  const m=new AdvancedMarkerElement({map:visible(s)?map:null,position:{lat:s.lat,lng:s.lng},title:s.name,content:pin,gmpClickable:true});
  m.addEventListener('gmp-click',()=>showSchool(s.id));
  schoolMarkers[s.id]=m;schoolPins[s.id]=pin;
 }
 refreshSectors();
 buildPriceLayer();
 map.data.addListener('click',e=>renderSectorDetail(e.feature));
 loadSectors();
}

/* Official Paris ArcGIS service: elementary school sectors, 2026–27 (ID_PROJET 4913).
   Query only sectors whose associated school fields contain one of the listed English-bilingual schools. */
function loadSectors(){
 const keys=schools.filter(s=>s.sector).map(s=>s.sector);
 const cols=['lib_etab_1','lib_etab_2','lib_etab_3','lib_etab_4'];
 const ors=[];
 for(const n of keys) for(const c of cols) ors.push(`${c} LIKE '%${n}%'`);
 const where='id_projet=4913 AND ('+ors.join(' OR ')+')';
 const queryUrl='https://capgeo2.paris.fr/opendata/rest/services/DASCO/DASCO_Secteurs_Scol_Secteurs/MapServer/1/query?'+new URLSearchParams({where,outFields:'*',returnGeometry:'true',outSR:'4326',f:'geojson'}).toString();
 fetch(queryUrl).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(gj=>{
  if(!gj.features)throw new Error(gj.error?.message||'GeoJSON unavailable');
  sectorFeatures=gj.features;
  map.data.addGeoJson(gj,{idPropertyName:'objectid'});
  document.getElementById('sectorStatus').textContent=T('sectorsLoaded',{n:sectorFeatures.length});
 }).catch(err=>{
  document.getElementById('sectorStatus').innerHTML=`${T('sectorsFail')} <a target="_blank" href="https://capgeo2.paris.fr/opendata/rest/services/DASCO/DASCO_Secteurs_Scol_Secteurs/MapServer/1">${T('openLayer')}</a>. ${T('reason')} ${esc(err.message)}`;
 });
}

/* Apartment-address search: Base Adresse Nationale (works from a local file, no key), then point-in-polygon against the loaded sectors. */
async function geocode(q){
 const u='https://api-adresse.data.gouv.fr/search/?'+new URLSearchParams({q,limit:'1',lat:'48.8566',lon:'2.3522'});
 const r=await fetch(u);if(!r.ok)throw new Error(T('addrUnavailable'));
 const a=await r.json();if(!a.features||!a.features.length)throw new Error(T('addrNotFound'));
 const f=a.features[0];return {lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],label:f.properties.label};
}
let suggestTimer=null;
document.getElementById('address').addEventListener('input',e=>{
 clearTimeout(suggestTimer);const q=e.target.value.trim();if(q.length<4)return;
 suggestTimer=setTimeout(async()=>{
  try{
   const r=await fetch('https://api-adresse.data.gouv.fr/search/?'+new URLSearchParams({q,limit:'6',autocomplete:'1',lat:'48.8566',lon:'2.3522'}));
   const a=await r.json();
   document.getElementById('addrList').innerHTML=(a.features||[]).map(f=>`<option value="${esc(f.properties.label)}">`).join('');
  }catch(e){}
 },250);
});
document.getElementById('searchBtn').addEventListener('click',checkAddress);
document.getElementById('address').addEventListener('keydown',e=>{if(e.key==='Enter')checkAddress();});
/* Map marker is best-effort: the sector check must work even if Google Maps failed to load. */
async function showAddressOnMap(p){
 if(!map)return;
 try{
  const {AdvancedMarkerElement,PinElement}=await google.maps.importLibrary('marker');
  if(addressMarker)addressMarker.map=null;
  const pin=new PinElement({background:'#facc15',borderColor:'#111827',glyphColor:'#111827',scale:1.1});
  addressMarker=new AdvancedMarkerElement({map,position:{lat:p.lat,lng:p.lng},title:T('addrChecked')+' '+p.label,content:pin,zIndex:1000});
  if(selectedId)setPinSize(selectedId,false);
  selectedId=null;selectedSector=null;refreshSectors();
  map.setZoom(15);map.panTo({lat:p.lat,lng:p.lng});
 }catch(e){}
}
async function checkAddress(){
 const q=document.getElementById('address').value.trim();if(!q)return;
 const box=document.getElementById('result');box.style.display='block';box.textContent=T('lookingUp');
 try{
  const p=await geocode(q);
  if(!sectorFeatures.length){showAddressOnMap(p);box.textContent=T('addrFoundNoLayer',{a:p.label});return;}
  const pt=turf.point([p.lng,p.lat]);
  const hits=sectorFeatures.filter(f=>{try{return turf.booleanPointInPolygon(pt,f);}catch(e){return false;}});
  addressHits=new Set(hits.map(f=>(f.properties||{}).objectid));
  showAddressOnMap(p);
  if(!hits.length){box.innerHTML='<b>'+esc(p.label)+'</b><br>'+T('notInSector');return;}
  const details=hits.map(f=>{const x=f.properties||{};return [x.lib_etab_1,x.lib_etab_2,x.lib_etab_3,x.lib_etab_4].filter(Boolean).join(', ');});
  box.innerHTML='<b>'+esc(p.label)+'</b><br>'+T('inSector')+'<br>'+details.map(esc).join('<br>')+'<br><span class="small">'+T('finalConfirm')+'</span>';
 }catch(e){box.textContent=T('lookupFail')+' '+e.message;}
}

applyStaticTexts();
buildFilters();
(()=>{
 const s=document.createElement('script');
 s.src='https://maps.googleapis.com/maps/api/js?'+new URLSearchParams({key:GOOGLE_MAPS_KEY,v:'weekly',loading:'async',callback:'initMap',language:LANG,region:'FR'});
 s.async=true;s.onerror=()=>showGlobalError(T('mapLoadFail'));
 document.head.appendChild(s);
})();
</script>
</body>
