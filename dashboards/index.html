<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboards</title>
<meta name="description" content="Maps and dashboards I build from open data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFFFFF; --surface: #F5F5F5; --border: #E5E5E5;
  --text-1: #0A0A0A; --text-2: #6B6B6B; --text-3: #A3A3A3;
  --font: 'Inter', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --pad: clamp(16px, 4vw, 48px);
  --max: 1120px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0A0A0A; --surface: #1A1A1A; --border: #2A2A2A; --text-1: #FAFAFA; --text-2: #A3A3A3; --text-3: #6B6B6B; }
}
:root[data-theme="dark"] { --bg: #0A0A0A; --surface: #1A1A1A; --border: #2A2A2A; --text-1: #FAFAFA; --text-2: #A3A3A3; --text-3: #6B6B6B; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text-1); font-family: var(--font); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--pad); }

.bar { border-bottom: 1px solid var(--border); }
.bar .wrap { display: flex; align-items: center; height: 56px; font-weight: 600; letter-spacing: -0.01em; }
.bar a:hover { color: var(--text-2); }

.hero { padding: clamp(56px, 10vw, 112px) 0 clamp(40px, 6vw, 64px); }
h1 { font-size: clamp(3rem, 9vw, 7rem); line-height: 1; letter-spacing: -0.035em; font-weight: 600; }
.hero p { margin-top: 16px; font-size: clamp(1.25rem, 2.6vw, 1.75rem); line-height: 1.25; letter-spacing: -0.01em; color: var(--text-2); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: clamp(64px, 10vw, 120px); }
.card { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 240px; padding: 28px; background: var(--bg); border: 1px solid var(--border); transition: background-color 0.2s, border-color 0.2s; }
.card:hover { border-color: var(--text-1); }
.card:hover { background: var(--surface); }
.card__kind { font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-3); }
.card__name { margin-top: 12px; font-size: 2rem; line-height: 1.1; letter-spacing: -0.02em; font-weight: 600; }
.card__line { margin-top: 8px; font-size: 1.0625rem; color: var(--text-2); }
.card__go { align-self: flex-end; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--text-1); display: grid; place-items: center; font-size: 18px; transition: background-color 0.2s, color 0.2s; }
.card:hover .card__go { background: var(--text-1); color: var(--bg); }
@media (max-width: 600px) { .card { min-height: 200px; padding: 22px 20px; } }
</style>
</head>
<body>

<header class="bar">
  <div class="wrap"><a href="/">tsytkin.com</a></div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Dashboards</h1>
    <p>Maps and dashboards I build from open data.</p>
  </section>

  <div class="grid">
    <a class="card" href="/dashboards/schoolmap/">
      <div>
        <div class="card__kind">Map</div>
        <div class="card__name">Schools map</div>
        <div class="card__line">French–English schools with CP in Paris</div>
      </div>
      <span class="card__go" aria-hidden="true">→</span>
    </a>
  </div>
</main>

</body>
</html>
